key: "hobbitish"
name: "Hobbitish"
description: |
  Hobbitish: the homely English of Tolkien's Shire.

  Tolkien anglicised the Shire's Westron into rural English with a comic turn, and this
  pack does the same: a mine is a delving, a big thing is michel, a meeting-place a moot,
  a hole a smial, a marsh a marish. Names are compounds read as English (Overhill,
  Longbottom, Michel Delving), sometimes two words. Founders have the short, jolly names
  of hobbit families, and rivers the sort a hobbit would give them — Willowwater,
  Thistlebrook.


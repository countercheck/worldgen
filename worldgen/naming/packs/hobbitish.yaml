  mine: ["delving", "pits"]
  clearing: ["stock", "ley"]
  spring: ["well", "spring"]
  hill: ["hill", "barrow", "knoll"]
  steading: ["ton", "by", "bottom"]
  hamlet: ["end", "row"]
  enclosure: ["fold", "hay", "garth"]
  cottages: ["smials", "holes"]
  field: ["field", "furrows", "acre"]

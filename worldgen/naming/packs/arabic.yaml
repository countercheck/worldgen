key: "arabic"
name: "Arabic"
description: |
  Arabic: Levantine and Maghrebi place names, romanised.

  A noun in the construct state leads and its qualifier follows with the article: Jisr
  al-Shughur, Ain al-Ghazal, Bab al-Hawa. A founder follows the head without it (Kafr
  Hamid, Qasr Ibn Wardan). The article is written al- throughout rather than assimilated
  (ash-Shams), which is the romanisation a map reader most often meets.

heads:
  ford: ["makhada"]
  bridge: ["jisr"]
  confluence: ["majma"]
  mouth: ["fam", "masabb"]
  falls: ["shallal"]
  pass: ["bab", "naqb"]
  harbour: ["marsa", "mina"]
  shore: ["shatt", "sahil"]
  market: ["suq"]
  mine: ["madin", "manjam"]
  clearing: ["fusha"]
  spring: ["ain", "bir"]
  hill: ["tell", "jabal"]
  steading: ["kafr", "qarya", "beit"]
  hamlet: ["dashra", "kufayr"]
  enclosure: ["hawsh"]
  cottages: ["khirbet"]
  field: ["haql", "marj"]
  town: ["madinat", "balad"]
  wick: ["khan", "funduq"]
  stow: ["majlis"]
  burgh: ["qalat", "qasr", "hisn"]
  hall: ["dar", "qasr"]
  wall: ["sur", "hisn"]

quals:
  marsh: ["al-batiha"]
  fen: ["al-ghadir", "al-hawr"]
  deepwood: ["al-ghaba"]
  wood: ["al-shajar"]
  thorn: ["al-shawk"]
  meadow: ["al-marj"]
  cold: ["al-barid"]
  sand: ["al-raml"]
  stone: ["al-hajar", "al-sakhr"]
  salt: ["al-milh"]
  rich: ["al-khayr"]
  high: ["al-ali", "al-ulya"]
  oak: ["al-ballut"]
  ash: ["al-murran"]
  elm: ["al-dardar"]
  birch: ["al-batula"]
  pine: ["al-sanawbar"]
  palm: ["al-nakhl", "al-nakhla"]
  broom: ["al-ratam"]
  reed: ["al-qasab"]
  ox: ["al-thawr", "al-baqar"]
  deer: ["al-ghazal"]
  swine: ["al-khinzir"]
  horse: ["al-khayl", "al-faras"]
  hare: ["al-arnab"]
  elk: ["al-ayyil"]
  wolf: ["al-dhib"]
  bear: ["al-dubb"]
  goat: ["al-maiz"]
  crane: ["al-kurki"]
  eagle: ["al-uqab", "al-nasr"]
  white: ["al-abyad", "al-bayda"]
  black: ["al-aswad", "al-sawda"]
  red: ["al-ahmar", "al-hamra"]
  green: ["al-akhdar", "al-khadra"]
  north: ["al-shamali"]
  south: ["al-janubi"]
  east: ["al-sharqi"]
  west: ["al-gharbi"]
  great: ["al-kabir", "al-kubra"]
  little: ["al-saghir", "al-sughra"]

templates:
  compound: ["{h} {q}"]
  founder: ["{h} {p}"]
  river_on: ["{h} {r}"]
  bare: ["{h}"]

proper_names:
  style: "lists"
  persons:
    first: ["Hamid", "Salim", "Karim", "Nasir", "Rashid", "Jamal", "Tariq", "Faris",
             "Mansur", "Khalil", "Zayd", "Hasan", "Musa", "Idris", "Yunus", "Harun",
             "Qasim", "Walid"]
    second: [""]
  rivers:
    roots: ["Barada", "Litani", "Awali", "Kalb", "Asi", "Zarqa", "Yarmuk", "Khabur",
             "Balikh", "Quwayq", "Afrin", "Sajur", "Hasbani", "Mujib", "Hasa", "Sebou",
             "Moulouya", "Tensift", "Draa", "Ziz", "Chelif", "Medjerda", "Tafna", "Sus",
             "Ouergha", "Mellah"]
    patterns: ["{root}", "{root}", "wadi {root}", "nahr {root}"]

spelling:
  particles: ["al", "ibn"]
  hyphen_caps: true

founder_gloss: "{p}'s {h}"

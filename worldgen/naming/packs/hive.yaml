templates:
  compound: ["{q}-{h}"]
  founder: ["{p}-{h}"]
  river_on: ["{r}-{h}"]
  bare: ["{h}"]

ranked:
  compound:
    - ["{h}-of-the-{q}", "{h}-under-{q}", "{h}-beside-{q}"]
    - ["{h}-by-{q}", "{q}-{h}"]
    - ["{q}-{h}"]
  founder:
    - ["{h}-of-{p}-swarm"]
    - ["{p}-swarm-{h}", "{h}-of-{p}-swarm"]
    - ["{p}-{h}"]
  river_on:
    - ["{h}-on-the-{r}"]
    - ["{h}-on-the-{r}", "{r}-{h}"]
    - ["{r}-{h}"]

proper_names:
  style: "syllables"
  registers:
    buzz:
      onsets: ["zz", "vr", "sh", "zh", "hm", "z", "v", "ss", "th"]
      vowels: ["aa", "u", "i", "ee", "o", "au"]
      codas: ["rr", "mm", "z", "", "ng", "ss"]
    click:
      onsets: ["k'", "tz'", "tch", "k", "t", "q'", "x", "tk"]
      vowels: ["i", "a", "e", "u"]
      codas: ["k", "t", "tch", "", "ik", "x"]
  by_rank:
    - ["buzz"]
    - ["buzz", "click"]
    - ["click"]

spelling:
  particles: ["of", "on", "the"]
  hyphen_caps: true

founder_gloss: "{h} of the {p} swarm"

key: "dutch"
name: "Dutch"
description: |
  Dutch: the place names of the Low Countries.

  Qualifier first, head last, one word, as in German and English — but with the words of a
  land made from water: -drecht and -voort a ford (Dordrecht, Amersfoort), -dam a dammed
  town, -dijk a dike, -veen peat bog, -broek marsh, -sluis a lock, -loo a woodland clearing
  (Venlo, Waterloo), -hem a home (Arnhem). A town on a river is aan it, as Alphen aan den
  Rijn is, and the rivers come Kromme and Oude as well as plain.

heads:
  ford: ["drecht", "voort"]
  bridge: ["brug", "brugge"]
  confluence: ["gemonde"]
  mouth: ["monde", "muiden"]
  falls: ["val"]
  pass: ["gat", "pas"]
  harbour: ["haven", "sluis"]
  shore: ["dijk", "oever", "strand"]
  market: ["markt"]
  mine: ["mijn", "groeve"]
  clearing: ["loo", "rode"]
  spring: ["bron", "born"]
  hill: ["berg", "heuvel"]
  steading: ["hoeve", "heem", "hem"]
  hamlet: ["buurt", "dorp"]
  enclosure: ["gaarde", "hof"]
  cottages: ["huizen", "hutten"]
  field: ["veld", "akker"]
  town: ["dam", "stad"]
  wick: ["wijk"]
  stow: ["stede"]
  burgh: ["burg", "borg"]
  hall: ["zaal"]
  wall: ["wal"]

quals:
  marsh: ["veen", "moer"]
  fen: ["broek", "ven"]
  deepwood: ["woud", "wold"]
  wood: ["hout", "bos"]
  thorn: ["doorn"]
  meadow: ["weide", "wei"]
  cold: ["koude"]
  sand: ["zand", "zande"]
  stone: ["steen"]
  salt: ["zout"]
  rich: ["rijk"]
  high: ["hoog", "hooge"]
  oak: ["eik", "eeke"]
  ash: ["es", "essche"]
  elm: ["olm", "iep"]
  birch: ["berk", "berken"]
  pine: ["den", "dennen"]
  palm: ["palm"]
  broom: ["brem"]
  reed: ["riet"]
  ox: ["os", "ossen"]
  deer: ["hert"]
  swine: ["zwijn"]
  horse: ["ros", "paarden"]
  hare: ["haas"]
  elk: ["eland"]
  wolf: ["wolf"]
  bear: ["beer"]
  goat: ["geit"]
  crane: ["kraan"]
  eagle: ["arend"]
  white: ["wit", "witte"]
  black: ["zwart", "zwarte"]
  red: ["rood", "roode"]
  green: ["groen"]
  north: ["noord"]
  south: ["zuid"]
  east: ["oost"]
  west: ["west"]
  great: ["groot"]
  little: ["klein"]

templates:
  compound: ["{q}{h}"]
  founder: ["{p}s{h}", "{p}{h}"]
  river_on: ["{h} aan de {r}", "{r}{h}"]
  bare: ["{h}"]

proper_names:
  style: "lists"
  persons:
    first: ["Ever", "Ger", "Arn", "Hen", "Rein", "Bou", "Wil", "Gods", "Ot", "Lam"]
    second: ["hard", "ald", "out", "ric", "win", "brecht"]
  rivers:
    roots: ["Amstel", "Vecht", "Eem", "Lek", "Linge", "Merwede", "Waal", "Dommel",
             "Dinkel", "Berkel", "Regge", "Reest", "Hunze", "Gouwe", "Rotte", "Schie",
             "Zaan", "Spaarne", "Dieze", "Mark", "Donge", "Roer", "Geul", "Niers",
             "Swalm", "Aa", "Drecht"]
    patterns: ["{root}", "{root}", "kromme {root}", "oude {root}"]

spelling:
  particles: ["aan", "de", "den", "op"]
  hyphen_caps: true

founder_gloss: "{p}'s {h}"

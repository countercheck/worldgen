key: "rohirric"
name: "Rohirric"
description: |
  Rohirric: the tongue of Tolkien's Riders of Rohan, which he rendered as Old English.

  So it is Old English, but the Mercian of a horse-people rather than the settled English
  of the `english` pack: -burg rather than -bury, seld for a hall (Meduseld), eoh and mearh
  for a horse (Éothéod, the Mearas), emnet for open plain, firien for a holy wood, wæsc for
  a wash of water. Names are kept in their older spellings — hwit, stan, heah — where the
  `english` pack has worn them down. A founder takes a plain genitive, as Helm's Deep does.


key: "quenya"
name: "Quenya"
description: |
  Quenya: the High-elven tongue of Tolkien's Middle-earth.

  Quenya compounds put the qualifier first and the head last, run together: Alqualondë is
  swan-haven, Valimar the home of the Valar. The vocabulary is from Tolkien's own lists and
  *The Etymologies*: londë a haven, yanta a bridge, osto a fortified town, ambo a hill,
  tavar a wood, ninquë white, morë black, formen north, alta great.

  A word-final ë keeps its diaeresis at the end of a name and loses it inside one, as
  Tolkien wrote them. Where no word is attested it is marked below.

  Rivers are built rather than borrowed: an element and sírë (river) or nen (water).

heads:
  ford: ["tarna"]
  bridge: ["yanta"]
  confluence: ["yomenië"]
  mouth: ["etsir"]
  falls: ["lanta"]
  pass: ["tië"]
  harbour: ["londë"]
  shore: ["hresta"]
  market: ["mancalë"]
  mine: ["rotto"]
  clearing: ["landë"]
  spring: ["ehtelë"]
  hill: ["ambo", "oron"]
  steading: ["mar"]
  hamlet: ["opelë"]
  enclosure: ["peler"]
  cottages: ["coa"]
  field: ["resta"]
  town: ["osto"]
  wick: ["osto", "mancalë"]
  stow: ["omentië"]
  burgh: ["arta", "mindon"]
  hall: ["sambë"]
  wall: ["ramba"]

quals:
  marsh: ["mixa"]
  fen: ["nen"]
  deepwood: ["taurë"]
  wood: ["tavar"]
  thorn: ["necel"]
  meadow: ["salquë"]
  cold: ["ringa"]
  sand: ["litsë"]
  stone: ["ondo"]
  salt: ["singë"]
  rich: ["alya"]
  high: ["tar"]
  oak: ["norno"]
  ash: ["ornë"]
  elm: ["alalmë"]
  birch: ["silwin"]
  pine: ["sonda"]
  palm: ["malinornë"]
  broom: ["aica"]
  reed: ["liscë"]
  ox: ["mundo"]
  deer: ["arassë"]
  swine: ["polca"]
  horse: ["rocco"]
  hare: ["lapat"]
  elk: ["arassë"]
  wolf: ["narmo", "ráca"]
  bear: ["morco"]
  goat: ["nyéni"]
  crane: ["alqua"]
  eagle: ["soron"]
  white: ["ninquë", "losse"]
  black: ["morë"]
  red: ["carnë"]
  green: ["laiquë"]
  north: ["formen"]
  south: ["hyarmen"]
  east: ["rómen"]
  west: ["númen"]
  great: ["alta"]
  little: ["pitya"]

templates:
  compound: ["{q}{h}"]
  founder: ["{p}{h}"]
  river_on: ["{r}{h}"]
  bare: ["{h}"]

proper_names:
  style: "lists"
  persons:
    first: ["Elen", "Anar", "Isil", "Tar", "Cal", "Vin", "Ear", "Fin", "Mir", "Ingo", "Nol"]
    second: ["dil", "wë", "ion", "ondo", "mir", "indë", "atan"]
  rivers:
    roots: ["ninquë", "morë", "carnë", "laiquë", "luin", "telpë", "laurë", "silma",
             "ringa", "mixa", "alta", "tára"]
    patterns: ["{root}sírë", "{root}nen"]

spelling:
  particles: []
  hyphen_caps: true
  fixes:
    - ["ë(?=[a-zà-ÿ])", "e"]

founder_gloss: "{p}'s {h}"

# Where a word is not the language's own, or means something other than the key.
notes:
  ford: "a crossing"
  confluence: "a meeting"
  falls: "a fall"
  pass: "a path"
  market: "trade"
  mine: "a cave"
  clearing: "an open space"
  marsh: "wet"
  meadow: "grass"
  ash: "a tree; no ash is attested"
  birch: "invented"
  pine: "invented"
  broom: "sharp, of gorse"
  crane: "a swan"

  bridge: ["ponte"]
  confluence: ["confluenza"]
  mouth: ["foce", "bocca"]
  falls: ["cascata", "salto"]
  pass: ["passo", "colle", "valico"]
  harbour: ["porto"]
  shore: ["marina", "riva", "lido"]
  market: ["mercato"]
  mine: ["miniera", "cava"]
  clearing: ["ronco", "radura"]
  spring: ["fonte", "fontana"]
  hill: ["monte", "colle", "poggio"]
  steading: ["casale", "villa", "masseria"]
  hamlet: ["borgata"]
  enclosure: ["chiusa", "corte"]
  cottages: ["capanna", "casetta"]
  field: ["campo", "prato"]
  town: ["borgo", "terra"]
  wick: ["mercatale", "fiera"]
  stow: ["pieve"]
  burgh: ["castello", "rocca"]
  hall: ["palazzo", "sala"]
  wall: ["castel"]


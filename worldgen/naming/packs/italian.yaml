key: "italian"
name: "Italian"
description: |
  Italian: the place names of medieval Italy.

  The head leads. An adjective agrees and follows, or runs into it — Monte Rosso,
  Castelnuovo, Villafranca, Acquaviva — and a noun follows with di and the article: Ponte
  del Lupo, Borgo delle Querce. A founder is usually a saint, whose church the place grew
  round (Borgo San Lorenzo); a town on a river sits sul it.

  The old words are kept where they survive in the names: pieve for the mother church a
  district gathered at, ronco for ground cleared by grubbing, chiusa for an enclosure.


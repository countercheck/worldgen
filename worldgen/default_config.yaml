# worldgen.yaml — Map generation configuration
# Pass to the CLI with: worldgen generate --config worldgen.yaml
#                        worldgen export  --config worldgen.yaml ...
# All values shown are defaults. Edit any line to override.

# ---------------------------------------------------------------------------
# Map dimensions
# ---------------------------------------------------------------------------
width: 128    # Map width in hexes. Default: 128
height: 128   # Map height in hexes. Default: 128
sea_level: 0.25  # Water level threshold (0–1) on normalised elevation. Lower = more land. Default: 0.25

# How width x height are laid onto the hex grid.
#   axial   Hex coordinates run q in [0, width), r in [0, height). The flat-top pixel
#           transform shears that rhombus, so the drawn map is a leaning parallelogram
#           with a straight edge on all four sides. Default.
#   offset  Odd-q offset column/row. The drawn map is a rectangle; odd columns sit half
#           a hex lower than even ones, so the north and south edges are ragged while
#           east and west stay straight.
# Columns are spaced 1.5 hex-sizes apart and rows sqrt(3), so an offset map is square
# when height is about 0.87 * width — 128 x 111, say.
grid_layout: axial

# ---------------------------------------------------------------------------
# Elevation noise (Fractal Brownian Motion)
# ---------------------------------------------------------------------------
noise_octaves: 6          # Number of FBM octaves; more = finer terrain detail. Default: 6
noise_persistence: 0.5    # Amplitude decay per octave (0–1). Default: 0.5
noise_lacunarity: 2.0     # Frequency multiplier per octave. Default: 2.0
noise_scale: 3.0          # Coordinate scale for noise sampling. Default: 3.0
domain_warp_strength: 0.3 # Displacement magnitude for domain warping; higher = more organic coastlines. Default: 0.3
continent_falloff: true   # Apply edge falloff so the sea rings the map and every river has a coast to reach. Set false for a landlocked map: no falloff is applied, the interior basin becomes the world's terminal sink, and it is endorheic by geometry. Default: true
# Which edges the sea comes in from. Drop an edge to let the land run off the map on
# that side instead of ending in a coast — the world continues past the border there.
# [] is the same as continent_falloff: false. Rivers can still drain off any border,
# ocean or not, so a partly-open map is not a trapped one.
#   [north, south, east, west]  →  an island, sea on all sides
#   [west]                      →  a west coast, land running inland to the east
#   [north, west]               →  a north-west corner of a larger continent
continent_falloff_edges: [north, south, east, west]
continent_shelf_variance: 0.35 # How much the shelf's inner edge wanders, 0–1. 0 gives a coast of even width; higher makes bays and headlands. The terrain noise already moves the shoreline a good deal on its own, so this is a nudge, not the main shaping. Default: 0.35
continent_shelf_hexes: 10 # Width in hexes (km) of the coastal shelf over which land drops away to the sea. In hexes rather than a fraction of the map, so the coastal gradient is the same per km at any size. Narrower = steeper, cliffier coasts. Capped at a quarter of the shorter side. Only used when continent_falloff is true. Default: 10
continent_seabed: 0.15    # Elevation the shelf descends to at the map edge. Must be below sea_level so the border is always under water. Nearer sea_level = a shallower, gentler shelf; nearer 0 = a steep drop into deep water, which makes cliff coasts common. Default: 0.15

# Directional tilt [east_bias, south_bias] added to raw elevation before normalization.
# Positive x raises the east edge; negative x raises the west edge.
# Positive y raises the south edge; negative y raises the north edge.
# Values around ±0.5 produce a clear slope across the map.
# Examples:
#   [0.0, -0.5]  →  north is highest, map runs downhill to the south
#   [-0.5, 0.0]  →  west is highest, map runs downhill to the east
#   [0.0, 0.0]   →  no tilt (default)
elevation_gradient: [0.0, 0.0]

# ---------------------------------------------------------------------------
# Elevation from an image
# ---------------------------------------------------------------------------
# Set heightmap_path to take the terrain from a picture instead of generating it. The
# image replaces the noise elevation stage; erosion, rivers, climate, biomes, settlements
# and roads all run on top of it unchanged. A relative path resolves against the working
# directory, the same as --config. The image is stretched to fill the grid on each axis,
# and each hex averages the pixels its footprint covers.
#
# Two notes. The path is copied into world.json as part of the config dump, so it travels
# with any world you export. And erosion still runs afterwards: it renormalises elevation
# to span the full 0-1 range, so in "elevation" mode a low-contrast heightmap comes out
# with its contrast stretched and its coast moved. Use `worldgen import-heightmap` when
# you need the image reproduced exactly — it skips erosion. ("coastline" mode is built to
# span the full range already, so that renormalisation leaves its coast alone.)
#
# Sizing: use grid_layout "offset" with height about 0.87 * width, or the imported map is
# sheared into a parallelogram. Give an image at least as large as the grid; a smaller one
# is upsampled into blocks of equal elevation, which flattens terrain classification.
heightmap_path: null      # Path to the image, or null to generate terrain as usual. Default: null

# How the image is read.
#   elevation  A greyscale heightmap. Luminance maps linearly onto the 0-1 elevation
#              range, black lowest and white highest.
#   coastline  A land/sea stencil only. Heights still come from the noise, shaped so
#              everything drawn as land sits above sea_level and everything drawn as sea
#              below it — so the coastline you drew is the coastline you get.
heightmap_mode: elevation # Default: elevation

# Coastline mode only. Where the image has a meaningful alpha channel, alpha decides what
# is land; otherwise luminance is compared against this threshold.
heightmap_land_threshold: 0.5 # Brightness at or above which a pixel is land. Default: 0.5
heightmap_invert: false   # True: the darker side of the threshold is the land instead. Default: false
# Coastline mode only. The stencil is authoritative by default, so land drawn running off
# the edge of the map stays land. Set true to also apply the rectangular edge falloff,
# which rings the map with sea and so guarantees every river a coast to reach — at the
# cost of eating a landmass you deliberately ran off the border.
heightmap_coast_falloff: false # Default: false

# ---------------------------------------------------------------------------
# Terrain classification
# ---------------------------------------------------------------------------
terrain_hill_gradient: 0.02      # Elevation gradient threshold for hills. Default: 0.02
terrain_mountain_gradient: 0.04  # Elevation gradient threshold for mountains. Default: 0.04

# ---------------------------------------------------------------------------
# Erosion (hydraulic droplet simulation)
# ---------------------------------------------------------------------------
erosion_iterations: 15000              # Number of water-droplet simulations. Default: 15000
erosion_inertia: 0.05                  # Droplet momentum factor. Default: 0.05
erosion_capacity: 4.0                  # Sediment capacity multiplier. Default: 4.0
erosion_deposition: 0.3                # Rate of sediment deposition. Default: 0.3
erosion_erosion_rate: 0.3              # Rate of terrain erosion. Default: 0.3
erosion_channel_affinity_gain: 0.5     # Affinity gain per deposition event; higher = deeper channels. Default: 0.5
erosion_affinity_update_interval: 500  # Update channel affinity every N droplets. Default: 500
erosion_delta_min_load: 0.15 # Sediment a droplet must still carry when it reaches the sea for it to build anything. Below this the load is treated as carried away along the shore rather than settling. Without it every droplet that trickled off a nearby hillside deposited where it entered the water, silting the shelf evenly instead of building deltas at the river mouths. Default: 0.15

# ---------------------------------------------------------------------------
# Hydrology
# ---------------------------------------------------------------------------
# How much the rain shadow shapes the rivers. Wind drops its moisture climbing a range
# and arrives dry on the far side; this decides whether the water reflects that. 0 rains
# evenly on every hex, 1 takes the orographic pattern at its word — so a catchment behind
# mountains raises a smaller river, and a lake there is likelier to evaporate away than to
# overflow. The map's total rainfall does not change with this, only where it falls, so a
# river being a fraction of the whole still means what it did. Below 1 by default because
# the pattern only models rain wrung out by lift, and taken literally it leaves every
# plain a desert.
rain_shadow_strength: 0.5   # Default: 0.5

river_flow_threshold: 0.05  # Minimum flow volume (0–1) for a hex to be a river. Default: 0.05

# Rivers that enter from off the map. The grid is a region, not a world, so some of its
# water was gathered beyond the border. An inlet is a border land hex whose terrain
# already descends inland; it is seeded with a catchment it did not earn on this map, so
# it arrives already wide instead of starting as a trickle at the edge. Set the count to
# 0 for a map that only drains outward.
river_inflow_count: 2      # Number of rivers entering from beyond the border. 0 disables. Default: 2
river_inflow_volume: 0.15  # Size of the off-map catchment, as a fraction of this map's land area. Relative rather than absolute so the same value means the same thing on any grid size. Default: 0.15
river_inflow_min_separation: 6 # Minimum spacing between inlets, in hexes. Without it the best candidates are usually the same valley mouth, and one river gets drawn twice. Default: 6
# Which edges water may arrive from. Drop an edge and no river enters on that side.
# Narrowing this places the off-map highlands: ["west"] means every river from beyond the
# border enters in the west, as though the range that feeds them lay off that corner.
river_inflow_edges: ["north", "south", "east", "west"] # Default: all four
# Left to itself the choice of inlet lands on a hex that descends steeply inland and then
# meets the sea a few hexes later, which is most of what a border offers. These two keep
# an imported river worth importing: the bias ranks candidates by how far the water then
# travels, and the floor makes a course shorter than that ineligible outright. A map with
# nothing longer gets fewer rivers than the count asks for, which beats one that enters
# and leaves again four hexes later.
river_inflow_length_bias: 2.0 # Exponent on the length of the course an inlet would take. 0 ignores length. Default: 2.0
river_inflow_min_length: 0.1  # Shortest course worth a river, as a fraction of the longer map dimension. 0 disables the floor. Default: 0.1

# Lake drainage. Every lake is filled to its spillway and given an outflow, so water
# that enters a basin has somewhere to go instead of accumulating forever.
lake_chaining: true             # Allow a lake to spill into a strictly lower lake, not just the sea. Chains of lakes stepping down to the coast are the only outlet on a landlocked map. Default: true
endorheic_marsh_radius: 1       # Where a basin genuinely has no outlet it is endorheic: water leaves by evaporation. This many hexes of its shore become wetland. 0 disables. Default: 1
endorheic_marsh_min_moisture: 0.4 # A closed basin drier than this is a salt pan, not a marsh, and gets no wetland shore. Default: 0.4

# Whether a basin is closed at all is a water balance, not a shape: it overflows when the
# rivers reaching it plus the rain on its surface exceed what evaporates off that surface.
# The per-hex evaporation comes from regional_climate below (a boreal lake loses half what
# a temperate one does; an arid lake three and a half times as much), and this scales it.
# Above 1 closes more basins; 0 makes any basin with inflow overflow. Raise it if your map
# has large lakes you would rather see as inland seas with no outlet.
endorheic_evaporation_scale: 1.0 # Multiplier on the climate's evaporation rate. Default: 1.0

# ---------------------------------------------------------------------------
# Climate
# ---------------------------------------------------------------------------
# The map is a region, not a world — 500 km at 1 hex = 1 km is about 4.5 degrees of
# latitude, some 3 C. Altitude does far more over the same distance (3000 m of relief is
# nearly 20 C) and rain shadow more again. So the region has one climate, named here, and
# the variety within it comes from terrain: elevation via the lapse rate, moisture via the
# orographic term. Each climate has a palette of biomes it can produce, so an arid region
# runs desert to steppe to alpine with altitude but never grows a jungle three valleys over.
#   boreal | temperate | mediterranean | arid | tropical
regional_climate: temperate
regional_moisture:        # Mean land moisture (0–1). Blank = take it from regional_climate. The orographic pass gives a relative wet/dry pattern; this says where that pattern is centred.
wind_direction: [1.0, 0.0]  # Wind vector [x, y] driving moisture transport. Default: [1.0, 0.0] (eastward)
base_temperature: 0.5       # Map's mean temperature (0=arctic, 1=tropical). Default: 0.5
latitude_temp_range: 0.0    # Pole-to-equator temperature variation. Negligible across a region; raise only if mapping something continental. Default: 0.0
altitude_lapse_rate: 0.4    # Temperature drop per unit of elevation. Default: 0.4
orographic_strength: 2.0    # Wind-driven precipitation intensity; higher = drier leeward slopes. Default: 2.0

# Flat moisture bias added to all land hexes after normalization.
# Positive = uniformly wetter; negative = uniformly drier. Clipped to [0, 1].
# Default: 0.0 (no adjustment)
base_moisture: 0.0

# ---------------------------------------------------------------------------
# Biome thresholds
# ---------------------------------------------------------------------------
biome_alpine_elev: 0.85  # Elevation above which terrain becomes alpine. Default: 0.85
biome_cold_temp: 0.25    # Temperature below which climate is considered cold. Default: 0.25
biome_warm_temp: 0.6     # Temperature above which climate is considered warm. Default: 0.6
biome_dry_moist: 0.2     # Moisture below which climate is considered dry. Default: 0.2
biome_wet_moist: 0.5     # Moisture above which climate is considered wet. Default: 0.5

# ---------------------------------------------------------------------------
# Settlements
# ---------------------------------------------------------------------------
# Habitability: how good a settlement site each hex is.  A site is scored on the land it
# can actually feed itself from — the mean food value of every hex within the tier's
# cultivation radius — plus flat bonuses for the site itself.  Because reach depends on
# tier, every hex gets three scores, and each tier is placed on its own.
#
# Food value of one hex, by land cover:
#   fertile   = open ground, woodland          marginal = scrub, dense forest
#   wetland   = bog, marsh                     water    = ocean, lake (fishing)
#   tundra, desert, alpine and bare rock are always 0
food_fertile_value: 1.0    # Prime arable. Default: 1.0
food_marginal_value: 0.4   # Grazing and hard-to-clear forest. Default: 0.4
food_wetland_value: 0.15   # Neither good fishing nor good ploughing; below water on purpose. Default: 0.15
food_water_value: 0.4      # Fishing. Non-zero so a coastal site is not penalised for having sea in its catchment. Default: 0.4

# Fertile and marginal hexes are additionally scaled by a moisture curve peaking across
# the [biome_dry_moist, biome_wet_moist] band and falling to 0 at both extremes — too dry
# is desert, too wet is waterlogged. Water and wetland ignore it.

habitability_agri_weight: 0.40      # Weight on the catchment mean. Default: 0.40
habitability_river_bonus: 0.25      # Flat bonus if the hex or a neighbour carries a river. Default: 0.25
habitability_coast_bonus: 0.25      # Flat bonus if the hex or a neighbour is coast. Default: 0.25
habitability_hill_bonus: 0.15       # Flat bonus for a hill overlooking a plain. Default: 0.15
habitability_confluence_bonus: 0.10 # Flat bonus on a river junction (this hex only). Default: 0.10

target_city_count: 6    # Number of cities to place. Default: 6
target_town_count: 24   # Number of towns to place. Default: 24
city_min_separation: 20 # Minimum hexes between any two cities. Default: 20
town_min_separation: 8  # Minimum hexes between any two towns. Default: 8
settlement_min_reachable: 100  # Minimum accessible hexes required for a valid settlement site. Default: 100

# ---------------------------------------------------------------------------
# Cultivation (farmland around settlements)
# ---------------------------------------------------------------------------
cultivation_city_radius: 8    # Farmland radius in hexes around cities. Default: 8
cultivation_town_radius: 4    # Farmland radius in hexes around towns. Default: 4
cultivation_village_radius: 2 # Farmland radius in hexes around villages. Default: 2

# ---------------------------------------------------------------------------
# World scale
# ---------------------------------------------------------------------------
hex_size_m: 1000.0        # Metres per hex; used for slope cost calculations. Default: 1000.0
road_elev_range_m: 3000.0 # Elevation span in metres representing the full 0→1 range. Default: 3000.0

# ---------------------------------------------------------------------------
# Roads: base terrain costs (pathfinding multipliers by terrain type)
# ---------------------------------------------------------------------------
road_flat_cost: 1.0       # Cost multiplier for flat hexes. Default: 1.0

# ---------------------------------------------------------------------------
# Roads: traveller simulation
# ---------------------------------------------------------------------------
road_travellers_city: 500    # Simulated daily travellers originating from each city. Default: 500
road_travellers_town: 100    # Simulated daily travellers originating from each town. Default: 100
road_travellers_village: 20  # Simulated daily travellers originating from each village. Default: 20
road_gravity_exponent: 1.5   # Distance-decay exponent for gravity model; higher = traffic stays local. Default: 1.5
road_bank_discount: 0.5      # Maximum cost reduction on a hex *beside* a river; multiplied by the largest adjacent river_flow. Roads follow the bank, not the channel, so which side they run on stays readable. Default: 0.5
road_bank_discount_min_flow: 0.2   # Floor on river_flow used in the discount calc; prevents tiny streams losing all their corridor pull. Default: 0.2
road_pheromone_factor: 0.1   # How strongly existing traffic attracts new routes. Default: 0.1

# ---------------------------------------------------------------------------
# Roads: water bodies (oceans + lakes are traversable as a single piece of terrain)
# ---------------------------------------------------------------------------
# Per-hex cost across water is tiny so distance across a body barely matters;
# the journey is paid for by the embark + disembark costs at the shores.
road_water_cost: 0.05    # Per-hex pathfinding cost on OCEAN/LAKE hexes. Default: 0.05
road_embark_cost: 8.0    # Cost charged on a land→water edge transition. Default: 8.0
road_disembark_cost: 8.0 # Cost charged on a water→land edge transition. Default: 8.0

# ---------------------------------------------------------------------------
# Roads: river crossings (charged on each land↔river edge, scales with flow)
# ---------------------------------------------------------------------------
# A perpendicular crossing of a 1-hex-wide river is charged twice
# (entering and leaving), so total ≈ 2 × (base + flow × max_river_flow).
road_river_crossing_base: 4.0  # Base cost added on each land↔river edge. Default: 4.0
road_river_crossing_flow: 12.0 # Additional cost × max(river_flow); biggest river adds the full amount. Default: 12.0
road_river_hex_cost: 12.0      # Cost of standing a road *on* a river hex. Prices out threading a meander or braid, while leaving a genuine crossing affordable. Default: 12.0
road_ferry_max_hop: 4          # Longest boat hop used to join a component a river mesh cuts off. Beyond this, routing raises RoutingError. Default: 4

# Slope-based cost: grade % = (elevation_delta_m / hex_size_m) * 100
road_slope_cost: 2.0      # Base multiplier applied to grade-based costs. Default: 2.0
road_slope_free_pct: 3.0  # Grade % below which slope adds no extra cost. Default: 3.0
road_slope_cap_pct: 25.0  # Grade % at which slope cost saturates. Default: 25.0
road_slope_cap_mult: 10.0 # Cost multiplier at saturation grade. Default: 10.0

road_min_traffic: 3       # Minimum traffic volume required to draw a road. Default: 3
road_river_traffic_min: 1 # Minimum traffic for a river hex to qualify as a drawn road; lower than road_min_traffic so towpaths/riverside trails appear from light traffic. Default: 1
road_primary_pct: 0.10    # Top fraction of traffic share classified as primary roads. Default: 0.10
road_secondary_pct: 0.30  # Next fraction classified as secondary roads. Default: 0.30
road_track_pct: 0.60      # Remainder classified as tracks. Default: 0.60

# ---------------------------------------------------------------------------
# Export  (used by: worldgen export --config worldgen.yaml ...)
# CLI flags --style, --color-mode, --hex-size, --padding, --layers override these.
# ---------------------------------------------------------------------------
export:
  style: atlas        # Visual style: atlas | topographic | wargame. Default: atlas
  color_mode: biome   # Hex fill colour: biome | terrain | land_cover | elevation. Default: biome
  hex_size: 12.0      # Hex size in pixels. Default: 12.0
  padding: 20         # Border padding in pixels. Default: 20
  layers:             # Layers to render. Remove a line to disable that layer.
    - terrain
    - rivers
    - roads
    - settlements
    - labels
    - grid
    - anchorages    # Anchor symbols where roads embark onto / land from water
    - crossings     # Ford and bridge symbols where roads meet a river
    - legend
    # - contours      # Uncomment to add topographic contour lines

  # River settings — only used when "rivers" is in the layers list above.
  # A river is drawn wider the more water it carries, so a headwater is visibly not
  # the trunk it feeds.
  river_min_width: 0.5      # Stroke width in pixels for the smallest stream. Default: 0.5
  river_max_width: 4.0      # Stroke width in pixels at the mouth of the largest river. Default: 4.0
  river_width_steps: 0      # 0 scales width continuously; a positive value quantises into that many discrete widths (fewer polylines, stream-order look); 1 draws every river at river_max_width. Default: 0
  river_width_exponent: 0.5 # Curve applied to flow before it is mapped onto the width range. Flow is power-law distributed, so 1.0 (linear) draws nine tenths of the network at river_min_width; 0.5 is the square root, matching hydraulic geometry. Lower widens small streams further. Default: 0.5

  # Rivers and roads are what a reader traces across the map, so each is drawn twice:
  # a dark casing, then the line itself on top. Without the casing a brown road
  # disappears into scrub and a blue river into dark forest.
  feature_outline: 0.9        # Casing width in pixels on each side. 0 draws flat, uncased lines. Default: 0.9
  river_color: "#2f6fbf"      # River line colour. The legend key uses this too, so the two cannot diverge. Default: "#2f6fbf"
  river_casing_color: "#0e2a50" # Colour of the casing under rivers. Default: "#0e2a50"
  road_casing_color: "#20140a"  # Colour of the casing under roads. Default: "#20140a"

  # Contour settings — only used when "contours" is in the layers list above
  contour_elevation_scale_m: 3000.0  # Elevation span in metres for contour scaling. Default: 3000.0
  contour_interval_m: 100.0          # Vertical spacing between contour lines in metres. Default: 100.0
  contour_max_crossings: 5           # Maximum contour lines drawn per hex edge. Default: 5
  contour_max_stroke: 4.0            # Maximum contour stroke width in pixels. Default: 4.0

  # Legend settings — only used when "legend" is in the layers list above.
  # On an axial grid the hexes are sheared into a parallelogram, leaving the top-right
  # and bottom-left of the canvas empty; the legend goes into one of them. An offset
  # grid fills its canvas, so there the legend sits in the corner over the map.
  legend_corner: top-right  # Which empty corner to use: top-right | bottom-left. Default: top-right
  legend_scale: 1.0         # Legend size as a multiple of hex_size. Default: 1.0

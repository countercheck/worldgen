# worldgen.yaml — Map generation configuration
# Pass to the CLI with: worldgen generate --config worldgen.yaml
#                        worldgen export  --config worldgen.yaml ...
# All values shown are defaults. Edit any line to override.

# ---------------------------------------------------------------------------
# Map dimensions
# ---------------------------------------------------------------------------
width: 128    # Map width in hexes. Default: 128
height: 128   # Map height in hexes. Default: 128

# How width x height are laid onto the hex grid.
#   axial   Hex coordinates run q in [0, width), r in [0, height). The flat-top pixel
#           transform shears that rhombus, so the drawn map is a leaning parallelogram
#           with a straight edge on all four sides. Default.
#   offset  Odd-q offset column/row. The drawn map is a rectangle; odd columns sit half
#           a hex lower than even ones, so the north and south edges are ragged while
#           east and west stay straight.
# Columns are spaced 1.5 hex-sizes apart and rows sqrt(3), so an offset map is square
# when height is about 0.87 * width — 128 x 111, say.
grid_layout: axial

# Elevation is metres above sea level, so sea level is zero by definition and is not a
# setting. How the map looks is set by how high the land stands and how deep the sea lies.
max_elevation_m: 1500.0  # Highest ground above sea level. The map's vertical scale, and the single most consequential setting for what country this is: 800 gives downland, 1500 mixed uplands, 3000 an Alpine massif. Default: 1500
seabed_depth_m: 200.0    # How deep the sea floor lies at the map edge. A continental shelf, not an abyss. How much of the map ends up underwater follows from this and max_elevation_m. Default: 200
coast_max_elevation_m: 100.0 # Land no higher than this beside the sea is coast. Default: 100

# ---------------------------------------------------------------------------
# Elevation noise (Fractal Brownian Motion)
# ---------------------------------------------------------------------------
noise_octaves: 6          # Number of FBM octaves; more = finer terrain detail. Default: 6
noise_persistence: 0.5    # Amplitude decay per octave (0–1). Default: 0.5
noise_lacunarity: 2.0     # Frequency multiplier per octave. Default: 2.0
noise_scale: 3.0          # Coordinate scale for noise sampling. Default: 3.0
domain_warp_strength: 0.3 # Displacement magnitude for domain warping; higher = more organic coastlines. Default: 0.3
continent_falloff: true   # Apply edge falloff so the sea rings the map and every river has a coast to reach. Set false for a landlocked map: no falloff is applied, the interior basin becomes the world's terminal sink, and it is endorheic by geometry. Default: true
# Which edges the sea comes in from. Drop an edge to let the land run off the map on
# that side instead of ending in a coast — the world continues past the border there.
# [] is the same as continent_falloff: false. Rivers can still drain off any border,
# ocean or not, so a partly-open map is not a trapped one.
#   [north, south, east, west]  →  an island, sea on all sides
#   [west]                      →  a west coast, land running inland to the east
#   [north, west]               →  a north-west corner of a larger continent
continent_falloff_edges: [north, south, east, west]
continent_shelf_variance: 0.35 # How much the shelf's inner edge wanders, 0–1. 0 gives a coast of even width; higher makes bays and headlands. The terrain noise already moves the shoreline a good deal on its own, so this is a nudge, not the main shaping. Default: 0.35
continent_shelf_hexes: 10 # Width in hexes (km) of the coastal shelf over which land drops away to the sea. In hexes rather than a fraction of the map, so the coastal gradient is the same per km at any size. Narrower = steeper, cliffier coasts. Capped at a quarter of the shorter side. Only used when continent_falloff is true. Default: 10

# Directional tilt [east, south] in metres, applied after the terrain is shaped.
# Positive x raises the east edge; negative x raises the west edge.
# Positive y raises the south edge; negative y raises the north edge.
# Examples:
#   [0.0, -600.0]  →  north stands 600 m higher, map runs downhill to the south
#   [-600.0, 0.0]  →  west stands 600 m higher, map runs downhill to the east
#   [0.0, 0.0]     →  no tilt (default)
elevation_gradient_m: [0.0, 0.0]  # Tilt across the map in metres: [east, south].

# ---------------------------------------------------------------------------
# Elevation from an image
# ---------------------------------------------------------------------------
# Set heightmap_path to take the terrain from a picture instead of generating it. The
# image replaces the noise elevation stage; erosion, rivers, climate, biomes, settlements
# and roads all run on top of it unchanged. A relative path resolves against the working
# directory, the same as --config. The image is stretched to fill the grid on each axis,
# and each hex averages the pixels its footprint covers.
#
# Two notes. The path is copied into world.json as part of the config dump, so it travels
# with any world you export. And erosion still runs afterwards, carving the imported
# terrain as it would a generated one — use `worldgen import-heightmap` when you need the
# image reproduced exactly, since that skips erosion. Erosion no longer renormalises the
# elevation range, so an imported coast stays where you drew it.
#
# Sizing: use grid_layout "offset" with height about 0.87 * width, or the imported map is
# sheared into a parallelogram. Give an image at least as large as the grid; a smaller one
# is upsampled into blocks of equal elevation, which flattens terrain classification.
heightmap_path: null      # Path to the image, or null to generate terrain as usual. Default: null

# How the image is read.
#   elevation  A greyscale heightmap. Luminance maps linearly onto the map's vertical
#              scale, black at -seabed_depth_m and white at max_elevation_m.
#   coastline  A land/sea stencil only. Heights still come from the noise, shaped so
#              everything drawn as land sits above sea level and everything drawn as sea
#              below it — so the coastline you drew is the coastline you get.
heightmap_mode: elevation # Default: elevation

# Coastline mode only. Where the image has a meaningful alpha channel, alpha decides what
# is land; otherwise luminance is compared against this threshold.
heightmap_land_threshold: 0.5 # Brightness at or above which a pixel is land. Default: 0.5
heightmap_invert: false   # True: the darker side of the threshold is the land instead. Default: false
# Coastline mode only. The stencil is authoritative by default, so land drawn running off
# the edge of the map stays land. Set true to also apply the rectangular edge falloff,
# which rings the map with sea and so guarantees every river a coast to reach — at the
# cost of eating a landmass you deliberately ran off the border.
heightmap_coast_falloff: false # Default: false

# ---------------------------------------------------------------------------
# Terrain classification
# ---------------------------------------------------------------------------
# Terrain classes are bands of gradient, in metres of rise per kilometre. They describe
# how the ground lies, not how high it is: a high plateau is level ground and is classed
# as such. Absolute rather than a fraction of the elevation range, so a band means the
# same thing whatever the map's vertical scale is.
#   under 30    FLAT        level going: plough it, cart across it
#   30 to 100   ROLLING     undulating; farmed, and a laden cart manages
#   100 to 250  STEEP       pack animals, terraces, no wheels
#   over 250    ESCARPMENT  a break of slope; on foot and with effort
terrain_rolling_gradient_m: 30.0     # m/km above which ground stops being level. Default: 30.0
terrain_steep_gradient_m: 100.0      # m/km above which wheels stop working. Default: 100.0
terrain_escarpment_gradient_m: 250.0 # m/km above which it is a break of slope. Default: 250.0

# ---------------------------------------------------------------------------
# Erosion (hydraulic droplet simulation)
# ---------------------------------------------------------------------------
# Droplets run per land hex, not per map, so the dose means the same thing at any size.
# It is what decides whether the map has valleys: below about one per hex the rivers only
# scratch a line into the noise and there is no floodplain. It is also a climate setting —
# the orographic term lifts on height above sea level, so wearing the high ground down
# flattens the rain shadow. 3.0 has floodplains and keeps most of the shadow; raising it
# buys level ground at the cost of the map having any dry country.
erosion_droplets_per_hex: 3.0          # Water-droplet simulations per land hex. Default: 3.0
erosion_inertia: 0.05                  # Droplet momentum factor. Default: 0.05
erosion_capacity: 4.0                  # Sediment capacity multiplier. Default: 4.0
erosion_deposition: 0.3                # Rate of sediment deposition. Default: 0.3
erosion_erosion_rate: 0.3              # Rate of terrain erosion. Default: 0.3
erosion_channel_affinity_gain: 0.5     # Affinity gain per deposition event; higher = deeper channels. Default: 0.5
erosion_affinity_update_interval: 500  # Update channel affinity every N droplets. Default: 500
erosion_delta_min_load: 0.15 # Sediment a droplet must still carry when it reaches the sea for it to build anything. Below this the load is treated as carried away along the shore rather than settling. Without it every droplet that trickled off a nearby hillside deposited where it entered the water, silting the shelf evenly instead of building deltas at the river mouths. Default: 0.15

# ---------------------------------------------------------------------------
# Hydrology
# ---------------------------------------------------------------------------
# A channel forms where enough water passes to keep one open: catchment area times runoff
# depth. This replaced a threshold that was really a rank — the top 5% of land by
# accumulation — which gave desert and rainforest alike 5.6% of their land under channel.
channel_min_discharge: 20000.0   # Catchment km2 x runoff mm needed to cut a channel. Default: 20000
navigable_min_discharge: 150000.0 # ...and to float a boat. Default: 150000
river_flow_continuous: false # Record a flow figure on every draining land hex, not only on hexes that carry a channel. Off by default: it is a diagnostic for inspecting the drainage field in the viewer, and turning it on does not add rivers to the map. Default: false
# Rain the ground and its plants take before anything runs off. Rises with temperature,
# which is why cold country sheds nearly all its rain and the taiga is full of rivers.
evapotranspiration_base_mm: 50.0  # Taken even at freezing. Default: 50
evapotranspiration_per_c_mm: 30.0 # ...plus this much per degree of mean temperature. Default: 30
min_runoff_mm: 25.0               # Floor, so even a desert drains its largest valleys. Default: 25
wetland_min_runoff_mm: 300.0      # Runoff above which flat riverside ground waterlogs. Default: 300

# Lake drainage. Every lake is filled to its spillway and given an outflow, so water
# that enters a basin has somewhere to go instead of accumulating forever.
lake_chaining: true             # Allow a lake to spill into a strictly lower lake, not just the sea. Chains of lakes stepping down to the coast are the only outlet on a landlocked map. Default: true
endorheic_marsh_radius: 1       # Where a basin genuinely has no outlet it is endorheic: water leaves by evaporation. This many hexes of its shore become wetland. 0 disables. Default: 1
endorheic_marsh_min_precip_mm: 300.0 # A closed basin drier than this is a salt pan, not a marsh, and gets no wetland shore. Default: 300

# ---------------------------------------------------------------------------
# Climate
# ---------------------------------------------------------------------------
# The map is a region, not a world — 500 km at 1 hex = 1 km is about 4.5 degrees of
# latitude, some 3 C. Altitude does far more over the same distance (3000 m of relief is
# nearly 20 C) and rain shadow more again. So the region has one climate, named here, and
# the variety within it comes from terrain: elevation via the lapse rate, moisture via the
# orographic term. Each climate has a palette of biomes it can produce, so an arid region
# runs desert to steppe to alpine with altitude but never grows a jungle three valleys over.
#   boreal | temperate | mediterranean | arid | tropical
regional_climate: temperate
# Leave mean_temperature_c and mean_precip_mm blank to take both from regional_climate.
# Writing a figure here pins it, which is rarely what you want: a config that names a
# climate and also pins the temperature gives you, say, arid rainfall over temperate air.
# Set one only to shift a region off its climate's default on purpose.
mean_temperature_c:       # Mean annual temperature at sea level, in Celsius. Blank = from regional_climate (boreal 1, temperate 10, mediterranean 16, arid 21, tropical 26).
mean_precip_mm:           # Mean annual rainfall over land, in millimetres. Blank = from regional_climate (boreal 450, temperate 800, mediterranean 550, arid 200, tropical 2000). The orographic pass gives a relative wet/dry pattern; this says what it is worth in real rain.
wind_direction: [1.0, 0.0]  # Wind vector [x, y] driving moisture transport. Default: [1.0, 0.0] (eastward)
latitude_temp_range_c: 0.0  # Degrees between the map's pole-ward and equator-ward edges. Negligible across a region — 128 km is about a degree of latitude. Default: 0.0
lapse_rate_c_per_km: 6.5    # How fast air cools with height, in Celsius per km. 6.5 is the standard environmental lapse rate. Default: 6.5
orographic_strength: 2.0    # Wind-driven precipitation intensity; higher = drier leeward slopes. Default: 2.0
moisture_resupply_per_hex: 0.08 # How much of its moisture deficit the air makes back each km, by evaporation. Without it a rain shadow would run from the first hill to the map edge. Default: 0.08

# Flat rainfall bias in millimetres a year, added to every land hex after the orographic
# pass. Positive = uniformly wetter, negative = uniformly drier. Use it to shift a whole
# map without changing the wet/dry pattern the terrain produces.
base_precip_mm: 0.0  # Default: 0.0 (no adjustment)

# Moisture carried inland along a river, so a valley is greener than the ground above it.
# Off by default: rivers already give a flat habitability bonus, and the bleed is a
# second, elevation-gated route to the same effect that is worth turning on only when you
# want visible riparian corridors.
moisture_bleed_passes: 0     # Bleed iterations. 0 = off, the flat river bonus only. Default: 0
moisture_bleed_strength: 0.3 # Share of the difference moved per pass, 0–1. Default: 0.3

# ---------------------------------------------------------------------------
# Biome thresholds
# ---------------------------------------------------------------------------
# The treeline is a temperature, not a height. The altitude it falls at follows from how
# warm the region is and how fast air cools with height — about 1850 m in temperate
# country, some 500 m in the subarctic, above 4300 m in the tropics.
#
# Keep it clear of every climate's own mean temperature. The alpine test runs ahead of
# every temperature rule, so a treeline that lands at sea level makes a whole region bare
# rock: at 1.0 C, which is the boreal region's own mean, a boreal map grew no taiga at all.
biome_treeline_temp_c: -2.0 # Mean annual Celsius at which trees stop. The height that falls at follows from the region's warmth and the lapse rate: ~1800 m temperate, ~500 m boreal, >4000 m tropical. Default: -2.0
biome_cold_temp_c: 5.0   # Mean annual Celsius below which the cold biomes take over — taiga gives way to broadleaf around here. Default: 5.0
biome_warm_temp_c: 18.0  # Mean annual Celsius above which the warm biomes take over. Default: 18.0
biome_dry_precip_mm: 400.0   # Annual rainfall below which the dry biomes take over — steppe and desert. Default: 400
biome_wet_precip_mm: 1000.0  # Annual rainfall above which the wet biomes take over — closed forest. Default: 1000
food_drowned_precip_mm: 3000.0 # Annual rainfall at which ground is leached and waterlogged and grows nothing. Default: 3000

# ---------------------------------------------------------------------------
# Settlements
# ---------------------------------------------------------------------------
# Habitability: how good a settlement site each hex is.  A site is scored on the land it
# can actually feed itself from — the mean food value of every hex within the tier's
# cultivation radius — plus flat bonuses for the site itself.  Because reach depends on
# tier, every hex gets three scores, and each tier is placed on its own.
#
# Food value of one hex, by land cover:
#   fertile   = open ground, woodland          marginal = scrub, dense forest
#   wetland   = bog, marsh                     water    = ocean, lake (fishing)
#   tundra, desert, alpine and bare rock are always 0
food_fertile_value: 1.0    # Prime arable. Default: 1.0
food_marginal_value: 0.4   # Grazing and hard-to-clear forest. Default: 0.4
food_wetland_value: 0.15   # Neither good fishing nor good ploughing; below water on purpose. Default: 0.15
food_water_value: 0.4      # Fishing. Non-zero so a coastal site is not penalised for having sea in its catchment. Default: 0.4

# Fertile and marginal hexes are additionally scaled by a rainfall curve peaking across
# the [biome_dry_precip_mm, biome_wet_precip_mm] band and falling to 0 at both ends — too
# dry is desert, too wet is leached and waterlogged (food_drowned_precip_mm sets the wet
# end). Water and wetland ignore it.

habitability_agri_weight: 0.40      # Weight on the catchment mean. Default: 0.40
habitability_river_bonus: 0.25      # Flat bonus if the hex or a neighbour carries a river. Default: 0.25
habitability_coast_bonus: 0.25      # Flat bonus if the hex or a neighbour is coast. Default: 0.25
habitability_hill_bonus: 0.15       # Flat bonus for a hill overlooking a plain. Default: 0.15
habitability_confluence_bonus: 0.10 # Flat bonus on a river junction (this hex only). Default: 0.10

# --- the classic model: counts and spacing are inputs -----------------------
# Used by `generate --model classic`. The map is told how many cities and towns to have
# and how far apart to keep them, so it produces six cities whether it is one fertile
# plain or landlocked desert.
target_city_count: 6    # Number of cities to place. Default: 6
target_town_count: 24   # Number of towns to place. Default: 24
city_min_separation: 20 # Minimum hexes between any two cities. Default: 20
town_min_separation: 8  # Minimum hexes between any two towns. Default: 8
settlement_min_reachable: 100  # Minimum accessible hexes required for a valid settlement site. Used by both models. Default: 100

# ---------------------------------------------------------------------------
# River crossings — § used by `--model organic`
# ---------------------------------------------------------------------------
# A river is not uniformly crossable. Most of its length is an obstacle; a few places are
# not, and those places are why towns sit where they do. Crossings are settled before
# anything else is built, so a bridging point can be the reason a market grows there
# rather than something noticed afterwards.
#
# A ford is terrain and is free — shallow braided water anyone can wade, needing nobody's
# permission. A bridge is capital, and appears only where enough traffic will use it.
ford_max_catchment_km2: 60.0 # Catchment area, in km2, at or below which the water can be waded. A physical figure comparable between maps: a stream draining a few tens of km2 is ankle deep and a step across; one draining thousands is not. Default: 60
crossing_relief_m: 60.0      # Local relief, in metres, that doubles how hard a reach is to get across. Fast water takes your feet from under you whatever its depth, and at a kilometre to the hex it is the approaches rather than the span that defeat a bridge. A floodplain has a few metres of this; a gorge has hundreds. Default: 60
bridge_pressure_per_span: 3.0 # Surplus needed within reach per multiple of the widest wadeable span, before a bridge is worth building. A river twice that width needs twice the traffic. Nobody bridges to nowhere. Default: 3.0
crossing_pressure_radius: 6   # How far either bank is searched for that surplus. Default: 6
crossing_min_separation: 4    # Nobody builds two bridges within sight of each other. Default: 4
crossing_use_cost: 0.5        # Cost of using an existing ford or bridge. Default: 0.5

# ---------------------------------------------------------------------------
# Haulage economics — § used by `--model organic`
# ---------------------------------------------------------------------------
# The ranges the settlement hierarchy is built on. Before rail and the motor lorry the
# binding constraint on where people live and how large a place can grow is what it costs
# to move bulk grain, and that one constraint generates the whole hierarchy.
#
# Each is a travel-cost budget rather than a distance, so terrain shortens it: at
# 1 hex = 1 km they are calibrated to give the historical figure on flat ground and less
# across hills. The ordering rural_field_radius < market_day_radius < haulage_range_land
# is the model's core claim and is enforced.
#
#   rural_field_radius   ~2 km   the daily walk out to the fields. Chisholm: cropping
#                                intensity falls off past ~1 km, land past 3–4 km is
#                                grazing or waste.
#   market_day_radius   ~10 km   out to market, business done, home inside a day.
#                                Bracton held markets should stand 6⅔ miles apart, a
#                                third of a twenty-mile day out and a third back.
#   haulage_range_land  ~40 km   bulk grain overland before the team has eaten the cargo.
#                                The softest figure here — what is well attested is the
#                                water ratio below, not this absolute.
rural_field_radius: 2.5    # The daily walk to the fields; sets cultivated extent. Default: 2.5
haulage_range_land: 40.0   # Travel cost at which bulk food is worth nothing overland. Default: 40.0
haulage_range_water_mult: 15.0 # How much further the same cargo goes by water. Diocletian's Price Edict prices land carriage at roughly 55x sea and 11x river for the same tonne-kilometre. This is why large pre-industrial cities sit on navigable water and inland ones stay small: nothing gates a city, water simply extends what can feed it. Default: 15.0
marketable_surplus_fraction: 0.20 # Share of what a farming household grows that can leave for a market; it eats the rest. Sizing markets off the surplus rather than the production is why the tier ratios come out right without target counts anywhere. Default: 0.20
people_per_food: 400.0     # People supported per unit of haulage-weighted food. Calibrated so market towns land in their historical 500–2500 band: across five seeds at 128x128 this gives medians of 1260–1700 and a largest of 4200–5450. Default: 400
travel_ascent_per_hex: 125.0 # Naismith's rule: metres of ascent that cost as much as one hex of level ground. Catchments are walked, not engineered, so they use this rather than road_delta_elevation_per_hex, which prices a graded road and is about five times stricter than a walker has reason to be. Default: 125
travel_ford_cost: 8.0      # Getting across away from a crossing, per multiple of the wadeable span, charged on each land–river edge. Deliberately has no fixed term, unlike road_river_crossing_base: that base is the capital of building a bridge, and somebody walking to market pays no capital — what stops them is how much water is in the way. Default: 8.0

# ---------------------------------------------------------------------------
# Market centres — § used by `--model organic`
# ---------------------------------------------------------------------------
# A market goes where it can gather the most surplus inside a day's return: central-place
# logic with a real transport cost rather than an abstract one. There is no target count —
# the number follows the land.
market_day_radius: 10.0     # A day's return: out, business done, and home. Default: 10.0
market_kernel_decay: 4.0    # d0 in the 1/(1 + d/d0) share a market takes from each hex it reaches. Default: 4.0
market_min_separation: 5    # A suppression disc only, to stop two markets sharing a hexside. Real spacing comes from competition for surplus, which is what makes markets dense on rich ground and sparse on poor — a fixed separation cannot express that. Default: 5
market_viability_floor: 14.0 # The one density knob, replacing target_city_count and target_town_count both: stop planting once the best remaining site scores below this. Calibrated to ~70–85 markets at 128x128 (England had ~700 markets in ~130,000 km2; this map is about an eighth of that): on a temperate map with continent_falloff_edges = [south], seeds 42/7/3/11/19 give 74–81 markets — one per ~205 km2 of land, a 15 km lattice, each about 10 km from its nearest neighbour. An absolute threshold on gathered surplus rather than a target, so density follows the land: the same value yields 9 markets on an arid map and 74 on a temperate one, while median market population stays flat across climates. Default: 14.0

# ---------------------------------------------------------------------------
# Cultivation (farmland around settlements)
# ---------------------------------------------------------------------------
cultivation_city_radius: 8    # Farmland radius in hexes around cities. Default: 8
cultivation_town_radius: 4    # Farmland radius in hexes around towns. Default: 4
cultivation_village_radius: 2 # Farmland radius in hexes around villages. Default: 2

# ---------------------------------------------------------------------------
# World scale
# ---------------------------------------------------------------------------
hex_size_m: 1000.0        # Metres per hex; used for slope cost calculations. Default: 1000.0

# ---------------------------------------------------------------------------
# Roads: base terrain costs (pathfinding multipliers by terrain type)
# ---------------------------------------------------------------------------
road_escarpment_cost: 20.0 # Cost multiplier for escarpment hexes. Default: 20.0
road_steep_cost: 10.0      # Cost multiplier for steep hexes. Default: 10.0
road_rolling_cost: 3.0     # Cost multiplier for rolling hexes. Default: 3.0
road_flat_cost: 1.0       # Cost multiplier for flat hexes. Default: 1.0

# ---------------------------------------------------------------------------
# Roads: traveller simulation
# ---------------------------------------------------------------------------
# Travellers come from population, not tier: a market of 6,200 wears a deeper road out of its gates than one of 900.
road_travellers_per_pop: 0.04 # Simulated travellers emitted per head of population. 0.04 keeps the total near what the old per-tier counts gave (about 8,000 over 74 markets on a 128x128 map). Default: 0.04
road_travellers_max: 500      # Cap per settlement, so one large city cannot drown the map. Reached above 12,500 people. Default: 500
road_gravity_exponent: 2.5   # Distance-decay exponent for the gravity model: a destination's appeal is pop / distance**this. 2.5 rather than the 1.5 a modern model would use, because a laden cart is not a lorry — at 1.5 a traveller was nearly as likely to make for a town 40 km off as one 10 km away, and 72% of every possible pair of settlements ended up with a road of its own. Default: 2.5
road_bank_discount: 0.5      # Maximum cost reduction on a hex *beside* a river; multiplied by the largest adjacent river_flow. Roads follow the bank, not the channel, so which side they run on stays readable. Default: 0.5
road_bank_discount_min_flow: 0.2   # Floor on river_flow used in the discount calc; prevents tiny streams losing all their corridor pull. Default: 0.2
road_pheromone_factor: 0.1   # How strongly existing traffic attracts new routes. Default: 0.1

# ---------------------------------------------------------------------------
# Roads: water bodies (oceans + lakes are traversable as a single piece of terrain)
# ---------------------------------------------------------------------------
# Per-hex cost across water is tiny so distance across a body barely matters;
# the journey is paid for by the embark + disembark costs at the shores.
road_water_cost: 0.05    # Per-hex pathfinding cost on OCEAN/LAKE hexes. Default: 0.05
road_embark_cost: 8.0    # Cost charged on a land→water edge transition. Default: 8.0
road_disembark_cost: 8.0 # Cost charged on a water→land edge transition. Default: 8.0

# ---------------------------------------------------------------------------
# Roads: river crossings (charged on each land↔river edge, scales with flow)
# ---------------------------------------------------------------------------
# A perpendicular crossing of a 1-hex-wide river is charged twice
# (entering and leaving), so total ≈ 2 × (base + flow × max_river_flow).
road_river_crossing_base: 4.0  # Base cost added on each land↔river edge. Default: 4.0
road_river_crossing_flow: 12.0 # Additional cost × max(river_flow); biggest river adds the full amount. Default: 12.0
road_river_hex_cost: 16.0      # Cost of standing a road *on* a river hex. Prices out threading a meander or braid, while leaving a genuine crossing affordable. Raised from 12 with road_delta_elevation_per_hex: pricing the climb made the valley floor more attractive, and roads began taking the channel as often as it occurs rather than declining it. Default: 16.0
road_ferry_max_hop: 4          # Longest boat hop used to join a component a river mesh cuts off. Beyond this, routing raises RoutingError. Default: 4

# Slope-based cost: grade % = (elevation_delta_m / hex_size_m) * 100
road_delta_elevation_per_hex: 25.0 # Metres of elevation change costing as much as one hex of level going — the switchback, priced. At 1 hex = 1 km a road climbing 200 m is not a straight ramp but several km of zigzag folded inside that hex, and this is the exchange rate that says so. Anchored on travel_ascent_per_hex (125, Naismith for a walker) divided by about five, a laden cart being far more gradient-sensitive than a man on foot. Symmetric in up and down: a road is cut-and-fill, and a steep descent needs braking. Default: 25.0
road_switchback_grade_pct: 10.0 # A road edge at or above this grade tags both its hexes "switchback", so a reader knows the segment is slow. The zigzag is priced but cannot be drawn at this scale. Default: 10.0
road_slope_cap_pct: 25.0  # Grade % at which slope cost saturates. Default: 25.0

road_settlement_skirt_cost: 4.0 # What a road pays to pass a settlement at one hex without entering it — an edge whose two ends both neighbour the same seat. The half of the settlement pull that works at one hex: a discount on the town itself only ever makes the detour a tie, since both routes pay for the same two ring hexes. About four hexes of level going. Default: 4.0
road_settlement_detour_max_mult: 4.0 # A road passing a settlement at one hex is bent through it instead, because a road that skirts a town at the width of a field is a motor-age idea. This caps what the detour may cost, as a multiple of the edge it replaces. 2.0 is free (a detour is two legs where there was one); this bounds the ground beyond that — the town on the far bank of a river, or up an escarpment. Default: 4.0
road_min_traffic: 3       # Minimum traffic volume required to draw a road. Default: 3
road_river_traffic_min: 1 # Minimum traffic for a river hex to qualify as a drawn road; lower than road_min_traffic so towpaths/riverside trails appear from light traffic. Default: 1
road_primary_pct: 0.10    # Top fraction of traffic share classified as primary roads. Default: 0.10
road_secondary_pct: 0.30  # Next fraction classified as secondary roads. Default: 0.30
road_track_pct: 0.60      # Remainder classified as tracks. Default: 0.60

# ---------------------------------------------------------------------------
# Export  (used by: worldgen export --config worldgen.yaml ...)
# CLI flags --style, --color-mode, --hex-size, --padding, --layers override these.
# ---------------------------------------------------------------------------
export:
  style: atlas        # Visual style: atlas | topographic | wargame. Default: atlas
  color_mode: biome   # Hex fill colour: biome | terrain | land_cover | elevation. Default: biome
  hex_size: 12.0      # Hex size in pixels. Default: 12.0
  padding: 20         # Border padding in pixels. Default: 20
  layers:             # Layers to render. Remove a line to disable that layer.
    - terrain
    - rivers
    - roads
    - settlements
    - labels
    - grid
    - anchorages    # Anchor symbols where roads embark onto / land from water
    - crossings     # Ford and bridge symbols where roads meet a river
    - legend
    # - contours      # Uncomment to add topographic contour lines

  # River settings — only used when "rivers" is in the layers list above.
  # A river is drawn wider the more water it carries, so a headwater is visibly not
  # the trunk it feeds.
  river_min_width: 0.5      # Stroke width in pixels for the smallest stream. Default: 0.5
  river_max_width: 4.0      # Stroke width in pixels at the mouth of the largest river. Default: 4.0
  river_width_steps: 0      # 0 scales width continuously; a positive value quantises into that many discrete widths (fewer polylines, stream-order look); 1 draws every river at river_max_width. Default: 0
  river_width_exponent: 0.5 # Curve applied to flow before it is mapped onto the width range. Flow is power-law distributed, so 1.0 (linear) draws nine tenths of the network at river_min_width; 0.5 is the square root, matching hydraulic geometry. Lower widens small streams further. Default: 0.5

  # Rivers and roads are what a reader traces across the map, so each is drawn twice:
  # a dark casing, then the line itself on top. Without the casing a brown road
  # disappears into scrub and a blue river into dark forest.
  feature_outline: 0.9        # Casing width in pixels on each side. 0 draws flat, uncased lines. Default: 0.9
  river_color: "#2f6fbf"      # River line colour. The legend key uses this too, so the two cannot diverge. Default: "#2f6fbf"
  river_casing_color: "#0e2a50" # Colour of the casing under rivers. Default: "#0e2a50"
  road_casing_color: "#20140a"  # Colour of the casing under roads. Default: "#20140a"

  # Contour settings — only used when "contours" is in the layers list above
  contour_elevation_scale_m: 3000.0  # Elevation span in metres for contour scaling. Default: 3000.0
  contour_interval_m: 100.0          # Vertical spacing between contour lines in metres. Default: 100.0
  contour_max_crossings: 5           # Maximum contour lines drawn per hex edge. Default: 5
  contour_max_stroke: 4.0            # Maximum contour stroke width in pixels. Default: 4.0

  # Legend settings — only used when "legend" is in the layers list above.
  # The hex grid is sheared into a parallelogram, leaving the top-right and
  # bottom-left of the canvas empty; the legend goes into one of them.
  legend_corner: top-right  # Which empty corner to use: top-right | bottom-left. Default: top-right
  legend_scale: 1.0         # Legend size as a multiple of hex_size. Default: 1.0

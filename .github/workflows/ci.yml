name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]" -q

      - name: Check code style
        run: python -m ruff check .

      - name: Check code formatting
        run: python -m ruff format --check .

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]" -q

      - name: Run tests
        run: python -m pytest -v --tb=short

      # No `|| true`. The floor is a ratchet: it is set just under the coverage the
      # suite actually carries, so a change that drops coverage materially fails here
      # rather than passing quietly. Raise it when the real figure rises; never lower it
      # to make a red build green.
      #
      # NUMBA_DISABLE_JIT makes the figure honest. coverage.py cannot instrument a
      # jitted function, so with numba active the whole droplet loop in `erosion.py`
      # reads as dead — the file scores 72% against a real 98%, and none of that code is
      # ratcheted at all. Disabling the JIT for this run costs about 50 seconds and puts
      # `erosion.py` back under the floor's protection. The tests are run for real, with
      # numba, in the step above; this one exists to measure.
      - name: Check test coverage
        env:
          NUMBA_DISABLE_JIT: "1"
        run: python -m pytest --cov=worldgen --cov-fail-under=85 --quiet

  # The gate branch protection points at. Its name is load-bearing: a required status
  # check is matched by name, so renaming this job silently stops it gating anything.
  required:
    name: CIExpected
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Linting or tests failed"
            exit 1
          fi
          echo "✅ All checks passed"
